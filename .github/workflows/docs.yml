name: Deploy schema docs

on:
  push:
    branches: [main]
    paths:
      - schema.yaml
      - mkdocs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install linkml mkdocs mkdocs-material

      - name: Generate docs from schema
        run: gen-doc schema.yaml --directory docs/

      - name: Generate ER diagram
        run: |
          {
            echo "# Entity Relationship Diagram"
            echo ""
            gen-erdiagram schema.yaml
          } > docs/er-diagram.md

      - name: Build site
        run: mkdocs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ github.event.deployment.payload.web_url }}
    steps:
      - uses: actions/deploy-pages@v4
